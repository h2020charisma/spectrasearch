quarkus.http.host=0.0.0.0
quarkus.http.port=8080
%test.quarkus.http.host=127.0.0.1
quarkus.http.static-resources.caching-enabled=false
quarkus.http.static-resources.index-page=__not_served__.html

quarkus.http.filter.hashed-assets.matches=^/assets/.*
quarkus.http.filter.hashed-assets.methods=GET,HEAD
quarkus.http.filter.hashed-assets.header."Cache-Control"=public,max-age=31536000,immutable

quarkus.http.filter.index.matches=^/index\.html$
quarkus.http.filter.index.methods=GET,HEAD
quarkus.http.filter.index.header."Cache-Control"=no-cache

quarkus.http.filter.service-worker.matches=^/serviceWorker\.js$
quarkus.http.filter.service-worker.methods=GET,HEAD
quarkus.http.filter.service-worker.header."Cache-Control"=no-cache

# The OIDC extension is built into the normal artifact, but its runtime tenant is
# opt-in. QUARKUS_OIDC_TENANT_ENABLED=true activates the policy below.
quarkus.oidc.tenant-enabled=false
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.scopes=profile,email
quarkus.oidc.authentication.redirect-path=/api/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.remove-redirect-parameters=true
quarkus.oidc.authentication.fail-on-missing-state-param=true
quarkus.oidc.authentication.nonce-required=true
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.state-cookie-age=2M
quarkus.oidc.authentication.cookie-force-secure=true
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.state-cookie-same-site=lax
quarkus.oidc.authentication.cookie-path=/search/
quarkus.oidc.authentication.cookie-path-header=X-Forwarded-Prefix
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.token.refresh-token-time-skew=5S
quarkus.oidc.token.refresh-token-cache-time-to-live=5S
quarkus.oidc.authentication.session-age-extension=5M
quarkus.oidc.token-state-manager.strategy=keep-all-tokens
quarkus.oidc.token-state-manager.encryption-required=true
quarkus.oidc.token-state-manager.split-tokens=false
quarkus.oidc.logout.path=/api/auth/rp-logout
quarkus.oidc.logout.post-logout-path=/api/auth/logged-out
quarkus.oidc.logout.logout-mode=form-post
quarkus.http.same-site-cookie."q_post_logout.*".value=lax

quarkus.http.auth.proactive=false
quarkus.http.auth.permission.auth-diagnostics.paths=/api/auth/diagnostics
quarkus.http.auth.permission.auth-diagnostics.policy=deny
quarkus.http.auth.permission.authenticated.paths=/api/auth/login,/api/auth/callback,/api/auth/local-logout,/api/auth/rp-logout
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.permission.auth-public.paths=/api/auth/session,/api/auth/logged-out
quarkus.http.auth.permission.auth-public.policy=permit

# Forwarded headers are ignored until an enabled deployment opts in and names
# the direct proxy peers and externally allowed hosts.
quarkus.http.proxy.proxy-address-forwarding=false
quarkus.http.proxy.allow-forwarded=false
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true

quarkus.rest-csrf.enabled=true
quarkus.rest-csrf.cookie-name=csrf-token
quarkus.rest-csrf.token-header-name=X-CSRF-TOKEN
quarkus.rest-csrf.create-token-path=/api/auth/session
quarkus.rest-csrf.cookie-http-only=false
quarkus.rest-csrf.cookie-force-secure=true
quarkus.rest-csrf.cookie-path=/search/
quarkus.http.same-site-cookie."csrf-token".value=strict
