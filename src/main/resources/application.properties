quarkus.http.host=0.0.0.0
quarkus.http.port=8080
%test.quarkus.http.host=127.0.0.1
quarkus.http.static-resources.caching-enabled=false
quarkus.http.static-resources.index-page=__not_served__.html

quarkus.http.filter.hashed-assets.matches=^/assets/.*
quarkus.http.filter.hashed-assets.methods=GET,HEAD
quarkus.http.filter.hashed-assets.header."Cache-Control"=public,max-age=31536000,immutable

quarkus.http.filter.index.matches=^/index\.html$
quarkus.http.filter.index.methods=GET,HEAD
quarkus.http.filter.index.header."Cache-Control"=no-cache

quarkus.http.filter.service-worker.matches=^/serviceWorker\.js$
quarkus.http.filter.service-worker.methods=GET,HEAD
quarkus.http.filter.service-worker.header."Cache-Control"=no-cache

# Phase 2 is opt-in so the ordinary Phase 1 shell remains independent of OIDC.
quarkus.oidc.tenant-enabled=false
quarkus.rest-csrf.enabled=false

%phase2.quarkus.oidc.tenant-enabled=true
%phase2.quarkus.oidc.application-type=web-app
%phase2.quarkus.oidc.auth-server-url=${PHASE2_OIDC_AUTH_SERVER_URL}
%phase2.quarkus.oidc.client-id=${PHASE2_OIDC_CLIENT_ID:spectrasearch-phase2}
%phase2.quarkus.oidc.credentials.secret=${PHASE2_OIDC_CLIENT_SECRET}
%phase2.quarkus.oidc.authentication.scopes=profile,email
%phase2.quarkus.oidc.authentication.redirect-path=/api/auth/callback
%phase2.quarkus.oidc.authentication.restore-path-after-redirect=true
%phase2.quarkus.oidc.authentication.remove-redirect-parameters=true
%phase2.quarkus.oidc.authentication.fail-on-missing-state-param=true
%phase2.quarkus.oidc.authentication.nonce-required=true
%phase2.quarkus.oidc.authentication.pkce-required=true
%phase2.quarkus.oidc.authentication.state-secret=${PHASE2_OIDC_STATE_SECRET}
%phase2.quarkus.oidc.authentication.state-cookie-age=2M
%phase2.quarkus.oidc.authentication.cookie-force-secure=true
%phase2.quarkus.oidc.authentication.cookie-same-site=lax
%phase2.quarkus.oidc.authentication.state-cookie-same-site=lax
%phase2.quarkus.oidc.authentication.cookie-path=/search/
%phase2.quarkus.oidc.authentication.cookie-path-header=X-Forwarded-Prefix
%phase2.quarkus.oidc.authentication.java-script-auto-redirect=false
%phase2.quarkus.oidc.token.refresh-expired=true
%phase2.quarkus.oidc.token.refresh-token-time-skew=5S
%phase2.quarkus.oidc.token.refresh-token-cache-time-to-live=${PHASE2_REFRESH_CACHE_TTL:5S}
%phase2.quarkus.oidc.authentication.session-age-extension=5M
%phase2.quarkus.oidc.token-state-manager.strategy=keep-all-tokens
%phase2.quarkus.oidc.token-state-manager.encryption-required=true
%phase2.quarkus.oidc.token-state-manager.encryption-secret=${PHASE2_OIDC_ENCRYPTION_SECRET}
%phase2.quarkus.oidc.token-state-manager.split-tokens=${PHASE2_SPLIT_TOKENS:false}
%phase2.quarkus.oidc.logout.path=/api/auth/rp-logout
%phase2.quarkus.oidc.logout.post-logout-path=/api/auth/logged-out
%phase2.quarkus.oidc.logout.logout-mode=${PHASE2_LOGOUT_MODE:form-post}
%phase2.quarkus.http.same-site-cookie."q_post_logout.*".value=lax

%phase2.quarkus.http.auth.proactive=false
%phase2.quarkus.http.auth.permission.phase2-authenticated.paths=/api/auth/login,/api/auth/callback,/api/auth/diagnostics,/api/auth/local-logout,/api/auth/rp-logout
%phase2.quarkus.http.auth.permission.phase2-authenticated.policy=authenticated
%phase2.quarkus.http.auth.permission.phase2-public.paths=/api/auth/session,/api/auth/logged-out
%phase2.quarkus.http.auth.permission.phase2-public.policy=permit

%phase2.quarkus.http.proxy.proxy-address-forwarding=true
%phase2.quarkus.http.proxy.allow-forwarded=false
%phase2.quarkus.http.proxy.allow-x-forwarded=true
%phase2.quarkus.http.proxy.enable-forwarded-host=true
%phase2.quarkus.http.proxy.enable-forwarded-prefix=true
%phase2.quarkus.http.proxy.trusted-proxies=127.0.0.1
%phase2.quarkus.http.host-validation.allowed-hosts=127.0.0.1

%phase2.quarkus.rest-csrf.enabled=true
%phase2.quarkus.rest-csrf.cookie-name=csrf-token
%phase2.quarkus.rest-csrf.token-header-name=X-CSRF-TOKEN
%phase2.quarkus.rest-csrf.create-token-path=/api/auth/session
%phase2.quarkus.rest-csrf.cookie-http-only=false
%phase2.quarkus.rest-csrf.cookie-force-secure=true
%phase2.quarkus.rest-csrf.cookie-path=/search/
%phase2.quarkus.http.same-site-cookie."csrf-token".value=strict
