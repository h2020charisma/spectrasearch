quarkus.http.host=0.0.0.0
quarkus.http.port=8080
%test.quarkus.http.host=127.0.0.1
quarkus.http.static-resources.caching-enabled=false
quarkus.http.static-resources.index-page=__not_served__.html

quarkus.http.filter.hashed-assets.matches=^/assets/.*
quarkus.http.filter.hashed-assets.methods=GET,HEAD
quarkus.http.filter.hashed-assets.header."Cache-Control"=public,max-age=31536000,immutable

quarkus.http.filter.index.matches=^/index\.html$
quarkus.http.filter.index.methods=GET,HEAD
quarkus.http.filter.index.header."Cache-Control"=no-cache

quarkus.http.filter.service-worker.matches=^/serviceWorker\.js$
quarkus.http.filter.service-worker.methods=GET,HEAD
quarkus.http.filter.service-worker.header."Cache-Control"=no-cache
